<style>
:root{--bg:#F1F5F9;--card:#FFFFFF;--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--soft:#F8FAFC;--navy:#0B1F3A;
--can:#059669;--canL:#ECFDF5;--sot:#2563EB;--sotL:#EFF6FF;--rem:#7C3AED;--remL:#F5F3FF;--gol:#D97706;--golL:#FFFBEB;
--pos:#15803D;--posL:#DCFCE7;--neg:#B91C1C;--inp:#FFF7D6}
@media (prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#111A2E;--ink:#E2E8F0;--mut:#94A3B8;--line:#1F2A44;--soft:#0F172A;
--canL:#06261C;--sotL:#0B1D3F;--remL:#1E1338;--golL:#2A1C06;--posL:#0B2E1A;--inp:#2A2410;--can:#34D399;--sot:#60A5FA;--rem:#A78BFA;--gol:#FBBF24;
--pos:#4ADE80;--neg:#F87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.75;margin-top:2px}
header button.back{background:none;border:0;color:#fff;font-size:15px;padding:0;margin-bottom:4px;cursor:pointer}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
.bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme:dark){.chip.on{background:#E2E8F0;color:#0B1220;border-color:#E2E8F0}}
.row2{display:flex;gap:8px;margin-bottom:10px}
select,input[type=search]{flex:1;min-width:0;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.day{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 6px}
.game{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.game .lg{font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.game .tm{font-weight:650;font-size:15px;margin:3px 0 8px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini div{border-radius:9px;padding:5px 7px;font-size:10.5px;color:var(--mut)}
.mini b{display:block;font-size:17px}
.c-can{background:var(--canL)}.c-can b{color:var(--can)}.c-sot{background:var(--sotL)}.c-sot b{color:var(--sot)}
.c-rem{background:var(--remL)}.c-rem b{color:var(--rem)}.c-gol{background:var(--golL)}.c-gol b{color:var(--gol)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{border-radius:14px;padding:10px 12px}
.kpi .t{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1;margin:2px 0}
.kpi .s{font-size:12px;color:var(--mut)}
.c-can .t,.c-can .v{color:var(--can)}.c-sot .t,.c-sot .v{color:var(--sot)}.c-rem .t,.c-rem .v{color:var(--rem)}.c-gol .t,.c-gol .v{color:var(--gol)}
.info{font-size:12px;color:var(--mut);background:var(--card);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.info b{color:var(--ink)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:10px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;font-weight:600;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button.on{color:#fff}
.box{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.box h3{margin:0 0 8px;font-size:14px}
.box h3 small{font-weight:400;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:600;color:var(--mut);text-align:center;padding:4px 2px;border-bottom:1px solid var(--line)}
td{text-align:center;padding:6px 2px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.L{font-weight:800}
td .pb,.op .pb{display:inline-block;min-width:44px;border-radius:7px;padding:2px 4px;font-weight:700}
input.odd{width:58px;font-size:15px;text-align:center;padding:5px 2px;border-radius:8px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
.e{font-weight:700;font-size:12px}
.e.pos{color:var(--pos);background:var(--posL);border-radius:6px;padding:1px 4px}.e.neg{color:var(--neg)}
.side{display:flex;gap:6px;margin-bottom:8px}
.side button{flex:1;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:6px;font-size:13px;cursor:pointer}
.side button.on{border-color:currentColor;font-weight:700}
.hist{display:flex;gap:3px;align-items:flex-end;height:46px;margin:4px 0 2px}
.hist i{flex:1;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.hist i.ov{opacity:1}.hist i.un{opacity:.35}
.histl{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.g3 div{background:var(--soft);border-radius:10px;padding:6px 4px;font-size:11px;color:var(--mut)}
.g3 b{display:block;font-size:16px;color:var(--ink)}
.note{font-size:11.5px;color:var(--mut);margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.pb.add{cursor:pointer;-webkit-user-select:none;user-select:none}
.pb.sel{box-shadow:0 0 0 2px var(--ink) inset}
.pb.sel::before{content:"✓ "}
#bol{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
 padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:space-around;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
#bol a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:11px;font-weight:600;padding:4px 2px;border-radius:10px;position:relative}
#bol a i{display:block;font-style:normal;font-size:19px;line-height:1.2}
#bol a.on{color:var(--navy);background:var(--soft)}
@media (prefers-color-scheme:dark){#bol a.on{color:#E2E8F0}}
#bol a s{position:absolute;top:0;right:18%;text-decoration:none;background:var(--gol);color:#fff;border-radius:999px;font-size:10px;min-width:17px;padding:1px 4px}

.chip.sm{padding:5px 10px;font-size:12px}

.op .tx{flex:1;min-width:0}.op .tx div{font-size:11px;color:var(--mut)}.op .tx b{font-size:13.5px}
.op .pr{text-align:center;min-width:64px}.op .pr div{font-size:11px;color:var(--mut);margin-top:2px}
.cnt{font-size:11.5px;color:var(--mut);margin-top:6px}.cnt b{color:var(--ink)}
.leg{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.leg:last-child{border-bottom:0}
.leg .tx{flex:1;min-width:0}.leg .tx div{font-size:11.5px;color:var(--mut)}.leg .tx b{font-size:14px}
.leg button{border:0;background:none;color:var(--neg);font-size:20px;cursor:pointer;padding:0 4px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
.big div{background:var(--soft);border-radius:12px;padding:8px 4px;font-size:11px;color:var(--mut)}
.big b{display:block;font-size:20px;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
select.pl{width:100%;margin:4px 0}
.mdd{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;border:2px solid var(--gol);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mdd .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mdd .hd b{color:var(--gol);font-size:15px}.mdd .hd span{font-size:11px;color:var(--mut)}
.mdd .sl{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.mdd .sl:last-of-type{border-bottom:0}
.mdd .sl div{font-size:11px;color:var(--mut)}.mdd .sl b{font-weight:650}
.mdd .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.mdd button{border:0;background:var(--gol);color:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.cmp{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.cmp .hd{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between}
.cmp .rw{display:flex;gap:6px;margin-bottom:6px}.cmp select,.cmp input{font-size:15px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.cmp select{flex:1}.cmp input.ln{width:72px}.cmp input.od{width:80px;background:var(--inp)}
.cmp .res{font-size:12.5px;color:var(--mut);margin-top:2px}.cmp .res b{color:var(--ink)}
.verd{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.45}
.verd.ok{background:var(--posL);color:var(--pos)}.verd.meh{background:#FEF3C7;color:#92400E}.verd.no{background:#FDE2E2;color:var(--neg)}

.verd b{font-weight:800}.verd p{margin:6px 0 0;color:var(--ink);font-size:13px}
.anl p{margin:5px 0;font-size:13px;line-height:1.45}.anl p.mais{color:var(--pos)}.anl p.menos{color:#B45309}.anl p.dica{background:var(--inp);border-radius:9px;padding:7px 9px;color:var(--ink)}

.ia details{margin:4px 0 8px}.ia summary{font-size:13px;color:var(--mut);cursor:pointer}.rw2{display:flex;gap:6px;margin:6px 0}.rw2 input,.rw2 select,.rw2 textarea{flex:1;min-width:0;font-size:15px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit}
.msg{border-radius:12px;padding:9px 11px;margin:8px 0;font-size:13.5px;line-height:1.5}.msg.u{background:var(--sotL);margin-left:30px}.msg.a{background:var(--soft);border:1px solid var(--line)}.msg ul{margin:4px 0;padding-left:18px}.msg .mh{display:block;margin-top:6px}
.trc{border-top:1px dashed var(--line);margin-top:8px;padding-top:4px}.tr1{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:5px 0;font-size:13px}.tr1 .btn{margin:0;white-space:nowrap}
.btn.sm{font-size:12.5px;padding:7px 10px;margin-top:4px}
.alert{background:#FEF3C7;color:#92400E;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.alert{background:#3A2A06;color:#FDE68A}}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>

function nbPmf(m,disp,n){const out=[];if(m==null||!(m>0))return out;
 if(disp<=1.02){let p=Math.exp(-m);for(let i=0;i<=n;i++){out.push(p);p*=m/(i+1)}}
 else{const r=m/(disp-1),q=1/disp;let p=Math.exp(r*Math.log(q));for(let i=0;i<=n;i++){out.push(p);p*=(i+r)/(i+1)*(1-q)}}return out}
function maisQue(mc,mf,disp){const n=Math.ceil(Math.max(mc,mf)*4+15),a=nbPmf(mc,disp,n),b=nbPmf(mf,disp,n);let c=0,e=0,f=0;
 for(let x=0;x<=n;x++)for(let y=0;y<=n;y++){const v=a[x]*b[y];if(x>y)c+=v;else if(x===y)e+=v;else f+=v}const t=c+e+f;return [c/t,e/t,f/t]}
// ---------- golos: Dixon-Coles (igual ao Excel/Python) e Poisson por partes
function pois(l,k){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p}
function poisOver(l,L){if(l==null||!(l>0))return null;let c=0;for(let i=0;i<=Math.floor(L);i++)c+=pois(l,i);return Math.max(0,Math.min(1,1-c))}
function grelha(lh,la,rho){const n=10,g=[];let s=0;for(let i=0;i<=n;i++){g.push([]);for(let k=0;k<=n;k++){let v=pois(lh,i)*pois(la,k);
 if(i===0&&k===0)v*=Math.max(1-lh*la*rho,1e-6);else if(i===0&&k===1)v*=Math.max(1+lh*rho,1e-6);else if(i===1&&k===0)v*=Math.max(1+la*rho,1e-6);
 else if(i===1&&k===1)v*=Math.max(1-rho,1e-6);g[i].push(v);s+=v}}return g.map(r=>r.map(v=>v/s))}
function pG(g,f){let p=0;g.forEach((r,i)=>r.forEach((v,k)=>{if(f(i,k))p+=v}));return p}
function partes(l1,l2){let a=0,b=0;for(let x=0;x<=10;x++)for(let y=0;y<=10;y++){const v=pois(l1,x)*pois(l2,y);if(x>y)a+=v;else if(y>x)b+=v}return [a,1-a-b,b]}
const corPb=(p,cor)=>{const a=p==null?0:Math.min(1,Math.max(0,p));return `background:color-mix(in srgb,${cor} ${Math.round(a*70)}%,transparent);color:${a>0.75?'#fff':'inherit'}`};
const celOdd=(k,p)=>{const v=lerOdd(k);const e=v&&p!=null?p*parseFloat(v.replace(',','.'))-1:null;
 return `<td><input class="odd" inputmode="decimal" data-k="${esc(k)}" data-p="${p}" value="${esc(v)}" placeholder="—"></td><td><span class="e ${e==null?'':e>=0.05?'pos':e<0?'neg':''}" data-e="${esc(k)}">${e==null?'':(e>0?'+':'')+Math.round(e*100)+'%'}</span></td>`};
