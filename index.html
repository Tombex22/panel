<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estatísticas">
<meta name="theme-color" content="#0B1F3A">
<link rel="apple-touch-icon" href="icon.png">
<title>Estatísticas</title>
<style>
:root{--bg:#F1F5F9;--card:#FFFFFF;--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--soft:#F8FAFC;--navy:#0B1F3A;
--can:#059669;--canL:#ECFDF5;--sot:#2563EB;--sotL:#EFF6FF;--rem:#7C3AED;--remL:#F5F3FF;--gol:#D97706;--golL:#FFFBEB;
--pos:#15803D;--posL:#DCFCE7;--neg:#B91C1C;--inp:#FFF7D6}
@media (prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#111A2E;--ink:#E2E8F0;--mut:#94A3B8;--line:#1F2A44;--soft:#0F172A;
--canL:#06261C;--sotL:#0B1D3F;--remL:#1E1338;--golL:#2A1C06;--posL:#0B2E1A;--inp:#2A2410;--can:#34D399;--sot:#60A5FA;--rem:#A78BFA;--gol:#FBBF24;
--pos:#4ADE80;--neg:#F87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.75;margin-top:2px}
header button.back{background:none;border:0;color:#fff;font-size:15px;padding:0;margin-bottom:4px;cursor:pointer}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 84px);max-width:760px;margin:0 auto}
.bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme:dark){.chip.on{background:#E2E8F0;color:#0B1220;border-color:#E2E8F0}}
.row2{display:flex;gap:8px;margin-bottom:10px}
select,input[type=search]{flex:1;min-width:0;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.day{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 6px}
.game{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.game .lg{font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.game .tm{font-weight:650;font-size:15px;margin:3px 0 8px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini div{border-radius:9px;padding:5px 7px;font-size:10.5px;color:var(--mut)}
.mini b{display:block;font-size:17px}
.c-can{background:var(--canL)}.c-can b{color:var(--can)}.c-sot{background:var(--sotL)}.c-sot b{color:var(--sot)}
.c-rem{background:var(--remL)}.c-rem b{color:var(--rem)}.c-gol{background:var(--golL)}.c-gol b{color:var(--gol)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{border-radius:14px;padding:10px 12px}
.kpi .t{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1;margin:2px 0}
.kpi .s{font-size:12px;color:var(--mut)}
.c-can .t,.c-can .v{color:var(--can)}.c-sot .t,.c-sot .v{color:var(--sot)}.c-rem .t,.c-rem .v{color:var(--rem)}.c-gol .t,.c-gol .v{color:var(--gol)}
.info{font-size:12px;color:var(--mut);background:var(--card);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.info b{color:var(--ink)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:10px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;font-weight:600;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button.on{color:#fff}
.box{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.box h3{margin:0 0 8px;font-size:14px}
.box h3 small{font-weight:400;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:600;color:var(--mut);text-align:center;padding:4px 2px;border-bottom:1px solid var(--line)}
td{text-align:center;padding:6px 2px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.L{font-weight:800}
td .pb{display:inline-block;min-width:44px;border-radius:7px;padding:2px 4px;font-weight:700}
input.odd{width:58px;font-size:15px;text-align:center;padding:5px 2px;border-radius:8px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
.e{font-weight:700;font-size:12px}
.e.pos{color:var(--pos);background:var(--posL);border-radius:6px;padding:1px 4px}.e.neg{color:var(--neg)}
.side{display:flex;gap:6px;margin-bottom:8px}
.side button{flex:1;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:6px;font-size:13px;cursor:pointer}
.side button.on{border-color:currentColor;font-weight:700}
.hist{display:flex;gap:3px;align-items:flex-end;height:46px;margin:4px 0 2px}
.hist i{flex:1;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.hist i.ov{opacity:1}.hist i.un{opacity:.35}
.histl{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.g3 div{background:var(--soft);border-radius:10px;padding:6px 4px;font-size:11px;color:var(--mut)}
.g3 b{display:block;font-size:16px;color:var(--ink)}
.note{font-size:11.5px;color:var(--mut);margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.pb.add{cursor:pointer;-webkit-user-select:none;user-select:none}
.pb.sel{box-shadow:0 0 0 2px var(--ink) inset}
.pb.sel::before{content:"✓ "}
#bol{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy);color:#fff;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
 display:none;align-items:center;justify-content:space-between;font-size:14px;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.2)}
#bol b{font-size:15px}
.leg{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.leg:last-child{border-bottom:0}
.leg .tx{flex:1;min-width:0}.leg .tx div{font-size:11.5px;color:var(--mut)}.leg .tx b{font-size:14px}
.leg button{border:0;background:none;color:var(--neg);font-size:20px;cursor:pointer;padding:0 4px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
.big div{background:var(--soft);border-radius:12px;padding:8px 4px;font-size:11px;color:var(--mut)}
.big b{display:block;font-size:20px;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
select.pl{width:100%;margin:4px 0}
.alert{background:#FEF3C7;color:#92400E;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.alert{background:#3A2A06;color:#FDE68A}}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

function pOver(m,L,disp){if(m==null||!(m>0))return null;const k=Math.floor(L);let cdf=0;
 if(disp<=1.02){let p=Math.exp(-m);for(let i=0;i<=k;i++){cdf+=p;p*=m/(i+1)}}
 else{const r=m/(disp-1),q=1/disp;let p=Math.exp(r*Math.log(q));for(let i=0;i<=k;i++){cdf+=p;p*=(i+r)/(i+1)*(1-q)}}
 return Math.max(0,Math.min(1,1-cdf))}

 $('#mn').innerHTML=html;
 document.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{S.dia=b.dataset.dia;lista()});
 document.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{S.ord=b.dataset.ord;guarda();lista()});
 $('#lg').onchange=e=>{S.liga=e.target.value;lista()};
 $('#q').oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;lista();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
 document.querySelectorAll('.game').forEach(g=>g.onclick=()=>{location.hash='j'+g.dataset.i});
}

function nbPmf(m,disp,n){const out=[];if(m==null||!(m>0))return out;
 if(disp<=1.02){let p=Math.exp(-m);for(let i=0;i<=n;i++){out.push(p);p*=m/(i+1)}}
 else{const r=m/(disp-1),q=1/disp;let p=Math.exp(r*Math.log(q));for(let i=0;i<=n;i++){out.push(p);p*=(i+r)/(i+1)*(1-q)}}return out}
function maisQue(mc,mf,disp){const n=Math.ceil(Math.max(mc,mf)*4+15),a=nbPmf(mc,disp,n),b=nbPmf(mf,disp,n);let c=0,e=0,f=0;
 for(let x=0;x<=n;x++)for(let y=0;y<=n;y++){const v=a[x]*b[y];if(x>y)c+=v;else if(x===y)e+=v;else f+=v}const t=c+e+f;return [c/t,e/t,f/t]}
// ---------- golos: Dixon-Coles (igual ao Excel/Python) e Poisson por partes
function pois(l,k){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p}
function poisOver(l,L){if(l==null||!(l>0))return null;let c=0;for(let i=0;i<=Math.floor(L);i++)c+=pois(l,i);return Math.max(0,Math.min(1,1-c))}
function grelha(lh,la,rho){const n=10,g=[];let s=0;for(let i=0;i<=n;i++){g.push([]);for(let k=0;k<=n;k++){let v=pois(lh,i)*pois(la,k);
 if(i===0&&k===0)v*=Math.max(1-lh*la*rho,1e-6);else if(i===0&&k===1)v*=Math.max(1+lh*rho,1e-6);else if(i===1&&k===0)v*=Math.max(1+la*rho,1e-6);
 else if(i===1&&k===1)v*=Math.max(1-rho,1e-6);g[i].push(v);s+=v}}return g.map(r=>r.map(v=>v/s))}
function pG(g,f){let p=0;g.forEach((r,i)=>r.forEach((v,k)=>{if(f(i,k))p+=v}));return p}
function partes(l1,l2){let a=0,b=0;for(let x=0;x<=10;x++)for(let y=0;y<=10;y++){const v=pois(l1,x)*pois(l2,y);if(x>y)a+=v;else if(y>x)b+=v}return [a,1-a-b,b]}
const corPb=(p,cor)=>{const a=p==null?0:Math.min(1,Math.max(0,p));return `background:color-mix(in srgb,${cor} ${Math.round(a*70)}%,transparent);color:${a>0.75?'#fff':'inherit'}`};
const celOdd=(k,p)=>{const v=lerOdd(k);const e=v&&p!=null?p*parseFloat(v.replace(',','.'))-1:null;
 return `<td><input class="odd" inputmode="decimal" data-k="${esc(k)}" data-p="${p}" value="${esc(v)}" placeholder="—"></td><td><span class="e ${e==null?'':e>=0.05?'pos':e<0?'neg':''}" data-e="${esc(k)}">${e==null?'':(e>0?'+':'')+Math.round(e*100)+'%'}</span></td>`};
// tabela de linhas Over/Under. pf(L) = P(mais de L). q: 't' total | 'c' casa | 'f' fora | outro rótulo
function tabela(j,s,q,Ls,pf,histArr,histArr2,cor,nm){
 const lado=S.lado;cor=cor||COR(['can','sot','rem'].includes(s)?s:'gol');const dois=histArr2!==undefined&&histArr2!==null;
 let h=`<table><tr><th>Linha</th><th>${lado==='over'?'Over':'Under'}</th><th>Odd justa</th><th>Tua odd</th><th>Edge</th>${histArr===false?'':`<th>${dois?'Últ.10 casa':'Últ.10'}</th>`}${dois?'<th>Últ.10 vis.</th>':''}</tr>`;
 Ls.forEach(L=>{const po=pf(L);const p=po==null?null:(lado==='over'?po:1-po);
  const h1=histArr?pctHist(histArr,L):null,h2=dois?pctHist(histArr2,L):null;const hh=x=>x==null?'–':(lado==='over'?pc(x):pc(1-x));
  const id=chaveOdd(j,s,q,L,lado);
  h+=`<tr><td class="L" style="color:${cor}">${L.toFixed(1)}</td><td>${pill(j,id,(nm||'')+' '+(lado==='over'?'Over':'Under')+' '+L.toFixed(1),p,cor)}</td><td>${od(p)}</td>
  ${celOdd(id,p)}${histArr===false?'':`<td>${hh(h1)}</td>`}${dois?`<td>${hh(h2)}</td>`:''}</tr>`});
 return h+'</table>';
}
// tabela de seleções sim/não (ambas marcam, parte com mais golos...)
function tabSel(j,s,itens,cor){let h='<table><tr><th style="text-align:left">Seleção</th><th>Prob.</th><th>Odd justa</th><th>Tua odd</th><th>Edge</th></tr>';
 itens.forEach(([lab,p])=>{const id=chaveOdd(j,s,'s',lab,'sel');h+=`<tr><td style="text-align:left;font-weight:600">${esc(lab)}</td><td>${pill(j,id,lab,p,cor)}</td><td>${od(p)}</td>${celOdd(id,p)}</tr>`});
 return h+'</table>'}
function barras(arr,L,cor){if(!arr)return '<div class="note">Sem histórico.</div>';const v=arr.slice().reverse();const mx=Math.max(1,...v.filter(x=>x!=null),L+1);
 return `<div class="hist">${v.map(x=>x==null?'<i style="background:var(--line);height:2px"></i>':`<i class="${x>L?'ov':'un'}" style="background:${cor};height:${Math.max(4,x/mx*100)}%" title="${x}"></i>`).join('')}</div>
 <div class="histl"><span>mais antigo</span><span>${v.filter(x=>x!=null).join(' · ')}</span><span>último</span></div>`}

function detalhe(i){
 const j=D.jogos[i];if(!j){location.hash='';return}
 $('#hd').innerHTML=`<button class="back" onclick="history.length>1?history.back():location.hash=''">‹ Jogos</button><h1>${esc(j.c)} vs ${esc(j.f)}</h1><div class="sub">${esc(j.l)} · ${esc(fmtDia(j.d))}</div>`;
 const s=S.stat,cor=COR(s==='mar'?'gol':s),Fc=D.forma[j.c],Ff=D.forma[j.f];
 const kp=(k,t,v,a,b,x)=>`<div class="kpi c-${k}"><div class="t">${t}</div><div class="v">${v}</div><div class="s">${a}</div>${x?`<div class="s">${x}</div>`:''}</div>`;
 const intv=(k)=>{const t=tot(j[k]);if(t==null)return '';const sd=Math.sqrt(D.disp[k][1]*t);return 'provável '+Math.max(0,Math.round(t-sd))+'–'+Math.round(t+sd)};
 const lh=j.g[0],la=j.g[1],G=(lh>0&&la>0)?grelha(lh,la,j.rho??-0.05):null,s1=j.s1??0.445;
 let h='';
 if(j.al)h+=`<div class="alert">⚠ ${esc(j.al)}</div>`;
 h+=`<div class="kpis">${kp('can','Cantos',f1(tot(j.can)),`${f1(j.can[0])} · ${f1(j.can[1])}`,0,intv('can'))}${kp('sot','Rem. baliza',f1(tot(j.sot)),`${f1(j.sot[0])} · ${f1(j.sot[1])}`,0,intv('sot'))}
 ${kp('rem','Remates',f1(tot(j.rem)),`${f1(j.rem[0])} · ${f1(j.rem[1])}`,0,intv('rem'))}${kp('gol','Golos',f1(tot(j.g)),`${f1(lh)} · ${f1(la)}`,0,'1 '+pc(j.p[0])+' · X '+pc(j.p[1])+' · 2 '+pc(j.p[2]))}</div>`;
 h+=`<div class="info"><b>${j.b?'Modelo + odds':'Só modelo'}</b> · valores casa · visitante${j.me?' · '+esc(j.me):''}</div>`;
 const TABS={can:'Cantos',sot:'Rem. baliza',rem:'Remates',gol:'Golos',mar:'Marcad.'};
 h+=`<div class="seg">${Object.keys(TABS).map(k=>`<button data-st="${k}" class="${k===s?'on':''}" style="${k===s?'background:'+COR(k==='mar'?'gol':k):''}">${TABS[k]}</button>`).join('')}</div>`;
 if(s!=='mar')h+=`<div class="side"><button data-ld="over" class="${S.lado==='over'?'on':''}" style="color:${cor}">Over (mais de)</button><button data-ld="under" class="${S.lado==='under'?'on':''}" style="color:${cor}">Under (menos de)</button></div>`;
 if(s==='can'||s==='sot'||s==='rem'){
  const dp=D.disp[s],m=j[s],T=tot(m);
  const NM={can:'Cantos',sot:'Remates à baliza',rem:'Remates'}[s];
  h+=`<div class="box"><h3>Total do jogo <small>· esperado ${f1(T)}</small></h3>${tabela(j,s,'t',linhas(T,6,2),L=>pOver(T,L,dp[1]),Fc&&Fc[s],(Ff&&Ff[s])||[],null,NM+' (total)')}</div>`;
  h+=`<div class="box"><h3>${esc(j.c)} <small>· esperado ${f1(m[0])}</small></h3>${tabela(j,s,'c',linhas(m[0],4,1),L=>pOver(m[0],L,dp[0]),Fc&&Fc[s+'F'],null,null,NM+' '+j.c)}</div>`;
  h+=`<div class="box"><h3>${esc(j.f)} <small>· esperado ${f1(m[1])}</small></h3>${tabela(j,s,'f',linhas(m[1],4,1),L=>pOver(m[1],L,dp[0]),Ff&&Ff[s+'F'],null,null,NM+' '+j.f)}</div>`;
  if(m[0]>0&&m[1]>0){const mq=maisQue(m[0],m[1],dp[0]);
   h+=`<div class="box"><h3>Quem faz mais ${NM.toLowerCase()}</h3>${tabSel(j,s+'mais',[[`Mais ${NM.toLowerCase()}: ${j.c}`,mq[0]],[`Mais ${NM.toLowerCase()}: empate`,mq[1]],[`Mais ${NM.toLowerCase()}: ${j.f}`,mq[2]]],cor)}</div>`}
  const Lc=T==null?0:Math.round(T)-0.5;
  h+=`<div class="box"><h3>Últimos 10 jogos <small>· total do jogo; barra cheia = acima de ${Lc.toFixed(1)}</small></h3>`;
  [[j.c,Fc],[j.f,Ff]].forEach(([n,F])=>{h+=`<div style="margin-top:8px;font-size:13px;font-weight:650">${esc(n)} <span class="note">${F?`a favor ${f1(F[s+'A'][0])} · contra ${f1(F[s+'A'][1])}`:''}</span></div>${barras(F&&F[s],Lc,cor)}`});
  h+='</div>';
 }else if(s==='gol'){
  if(!G){h+='<div class="empty">Sem golos esperados para este jogo.</div>'}else{
  const T=lh+la,seg=(F)=>F&&F.gol&&F.h1?F.gol.map((x,i)=>x==null||F.h1[i]==null?null:x-F.h1[i]):null;
  h+=`<div class="box"><h3>Total de golos <small>· esperado ${f1(T)}</small></h3>${tabela(j,'gol','t',[0.5,1.5,2.5,3.5,4.5],L=>pG(G,(a,b)=>a+b>L),Fc&&Fc.gol,(Ff&&Ff.gol)||[],null,'Golos (total)')}</div>`;
  h+=`<div class="box"><h3>${esc(j.c)} <small>· golos esperados ${f1(lh)}</small></h3>${tabela(j,'gol','c',[0.5,1.5,2.5],L=>pG(G,(a,b)=>a>L),Fc&&Fc.golF,null,null,'Golos '+j.c)}</div>`;
  h+=`<div class="box"><h3>${esc(j.f)} <small>· golos esperados ${f1(la)}</small></h3>${tabela(j,'gol','f',[0.5,1.5,2.5],L=>pG(G,(a,b)=>b>L),Ff&&Ff.golF,null,null,'Golos '+j.f)}</div>`;
  const l1=T*s1,l2=T*(1-s1);
  h+=`<div class="box"><h3>1.ª parte <small>· esperado ${f1(l1)} golos</small></h3>${tabela(j,'g1','t',[0.5,1.5,2.5],L=>poisOver(l1,L),Fc&&Fc.h1,(Ff&&Ff.h1)||[],null,'Golos 1.ª parte')}</div>`;
  h+=`<div class="box"><h3>2.ª parte <small>· esperado ${f1(l2)} golos</small></h3>${tabela(j,'g2','t',[0.5,1.5,2.5],L=>poisOver(l2,L),seg(Fc),seg(Ff)||[],null,'Golos 2.ª parte')}</div>`;
  const pt=partes(l1,l2),bt=pG(G,(a,b)=>a>0&&b>0),P0=G[0][0],ex=Math.exp;
  const m2=x=>(1-ex(-x*s1))*(1-ex(-x*(1-s1)));
  h+=`<div class="box"><h3>Ambas marcam e quem marca</h3>${tabSel(j,'gsel',[['Ambas marcam — Sim',bt],['Ambas marcam — Não',1-bt],
   ['1.ª a marcar: '+j.c,lh/(lh+la)*(1-P0)],['1.ª a marcar: '+j.f,la/(lh+la)*(1-P0)],['1.ª a marcar: nenhuma (0-0)',P0],
   ['Última a marcar: '+j.c,lh/(lh+la)*(1-P0)],['Última a marcar: '+j.f,la/(lh+la)*(1-P0)]],cor)}</div>`;
  h+=`<div class="box"><h3>Por partes</h3>${tabSel(j,'gpar',[['Golos nas duas partes — Sim',m2(T)],['Golos nas duas partes — Não',1-m2(T)],
   [j.c+' marca nas duas partes',m2(lh)],[j.f+' marca nas duas partes',m2(la)],
   [j.c+' marca na 1.ª parte',1-ex(-lh*s1)],[j.f+' marca na 1.ª parte',1-ex(-la*s1)],
   [j.c+' marca na 2.ª parte',1-ex(-lh*(1-s1))],[j.f+' marca na 2.ª parte',1-ex(-la*(1-s1))],
   [j.c+' não sofre na 1.ª parte',ex(-la*s1)],[j.f+' não sofre na 1.ª parte',ex(-lh*s1)],
   [j.c+' não sofre na 2.ª parte',ex(-la*(1-s1))],[j.f+' não sofre na 2.ª parte',ex(-lh*(1-s1))],
   ['Parte com mais golos: 1.ª',pt[0]],['Parte com mais golos: igual',pt[1]],['Parte com mais golos: 2.ª',pt[2]]],cor)}
   <div class="note">Na 1.ª parte marcam-se ${Math.round(s1*100)}% dos golos nesta liga (medido nos últimos 2 anos).</div></div>`;
  h+=`<div class="box"><h3>Últimos 10 jogos <small>· golos no jogo; barra cheia = mais de 2.5</small></h3>`;
  [[j.c,Fc],[j.f,Ff]].forEach(([n,F])=>{h+=`<div style="margin-top:8px;font-size:13px;font-weight:650">${esc(n)} <span class="note">${F&&F.golA?`marca ${f1(F.golA[0])} · sofre ${f1(F.golA[1])}`:''}</span></div>${barras(F&&F.gol,2.5,cor)}`});
  h+='</div>';}
 }else{
  [[j.c,j.mc,'c',lh],[j.f,j.mf,'f',la]].forEach(([n,ls,q,l])=>{
   h+=`<div class="box"><h3>${esc(n)} <small>· golos esperados ${f1(l)}</small></h3>`;
   if(!ls||!ls.length){h+='<div class="note">Sem jogadores com dados para esta equipa.</div></div>';return}
   h+='<table><tr><th style="text-align:left">Jogador</th><th>Marca</th><th>Odd justa</th><th>Tua odd</th><th>Edge</th><th>2+</th><th>1.º</th></tr>';
   ls.forEach(([nome,p,p2,p1])=>{const id=chaveOdd(j,'mar',q,nome,'sim');h+=`<tr><td style="text-align:left;font-weight:600;font-size:12.5px">${esc(nome)}</td><td>${pill(j,id,'Marcador: '+nome,p,cor)}</td><td>${od(p)}</td>
    ${celOdd(id,p)}<td>${pc(p2)}</td><td>${pc(p1)}</td></tr>`});
   h+='</table></div>'});
  const todos=[...(j.mc||[]).map(x=>[x[0],x[1],j.c]),...(j.mf||[]).map(x=>[x[0],x[1],j.f])];
  if(todos.length>1){const ops=todos.map((x,k)=>`<option value="${k}">${esc(x[0])} (${esc(x[2])}) · ${pc(x[1])}</option>`).join('');
   const a0=+(S.d1??0),b0=+(S.d2??1);
   h+=`<div class="box"><h3>Um dos 2 jogadores a marcar</h3><select class="pl" id="d1">${ops}</select><select class="pl" id="d2">${ops}</select><div id="duo"></div></div>`;
   S._duo={todos,a0,b0};}
  h+='<div class="note">Marca = probabilidade de marcar a qualquer momento; 2+ = bis; 1.º = primeiro marcador do jogo. Vem da quota de golos/xG de cada jogador e dos minutos esperados. Ausentes assinalados na folha Jogadores (coluna "ausente" = SIM) ficam de fora; confirma os onzes antes de apostar.</div>';
 }
 h+=`<div class="box"><h3>Resultado <small>· compacto</small></h3><div class="g3"><div><b>${pc(j.p[0])}</b>Casa</div><div><b>${pc(j.p[1])}</b>Empate</div><div><b>${pc(j.p[2])}</b>Visitante</div></div></div>`;
 h+=`<div class="note"><b>Toca numa percentagem</b> para a juntar ao boletim (dupla): a barra em baixo mostra a probabilidade combinada. Odd justa = 1 ÷ probabilidade. Edge = probabilidade × tua odd − 1: verde a partir de +5%. As odds que escreves ficam guardadas só neste telemóvel. "Últ.10" = em quantos dos últimos 10 jogos a equipa passou a linha (total do jogo nas tabelas do total; o número da própria equipa nas tabelas por equipa).</div>`;
 $('#mn').innerHTML=h;window.scrollTo(0,0);ligaAdd();barraB();
 if(s==='mar'&&S._duo&&$('#d1')){const {todos}=S._duo;const d1=$('#d1'),d2=$('#d2');d1.value=Math.min(S._duo.a0,todos.length-1);d2.value=Math.min(S._duo.b0,todos.length-1);
  const duo=()=>{const a=todos[+d1.value],b=todos[+d2.value];S.d1=d1.value;S.d2=d2.value;if(d1.value===d2.value){$('#duo').innerHTML='<div class="note">Escolhe dois jogadores diferentes.</div>';return}
   const p=1-(1-a[1])*(1-b[1]),lab='Um de '+a[0]+' / '+b[0]+' marca';
   $('#duo').innerHTML=tabSel(j,'duo',[[lab,p]],cor)+'<div class="note">Probabilidade de pelo menos um dos dois marcar.</div>';ligaAdd();
   document.querySelectorAll('#duo input.odd').forEach(inp=>inp.oninput=()=>oddIn(inp))};
  d1.onchange=duo;d2.onchange=duo;duo()}
 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.stat=b.dataset.st;guarda();detalhe(i)});
 document.querySelectorAll('[data-ld]').forEach(b=>b.onclick=()=>{S.lado=b.dataset.ld;guarda();detalhe(i)});
 document.querySelectorAll('input.odd').forEach(inp=>inp.oninput=()=>oddIn(inp));
}
function oddIn(inp){const k=inp.dataset.k,p=parseFloat(inp.dataset.p),v=inp.value.trim();gravaOdd(k,v);
  const o=parseFloat(v.replace(',','.')),el=document.querySelector(`[data-e="${CSS.escape(k)}"]`);
  if(!el)return;if(!(o>1)||isNaN(p)){el.textContent='';el.className='e';return}const e=p*o-1;el.textContent=(e>0?'+':'')+Math.round(e*100)+'%';el.className='e '+(e>=0.05?'pos':e<0?'neg':'')}
function rota(){const m=location.hash.match(/^#j(\d+)$/);if(m)detalhe(+m[1]);else if(location.hash==='#b')boletim();else lista();barraB()}
window.addEventListener('hashchange',rota);
if(!D||!D.jogos){document.body.innerHTML='<div class="empty">Sem dados. Corre o ATUALIZAR no PC.</div>'}else rota();
