<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Estatísticas">

<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Estatísticas</title>
<style>
:root{--bg:#F3F5F9;--card:#FFFFFF;--ink:#0B1220;--mut:#6B7280;--line:#E8ECF2;--line2:#CBD5E1;--soft:#F6F8FB;--navy:#0B1F3A;--acc:#4F46E5;--accL:#EEF2FF;
--can:#059669;--canL:#E8F8F1;--sot:#2563EB;--sotL:#EAF1FF;--rem:#7C3AED;--remL:#F3EEFF;--gol:#D97706;--golL:#FFF6E5;
--pos:#15803D;--posL:#DCFCE7;--neg:#DC2626;--inp:#FFF8E1;--sh:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);--r:20px}
@media (prefers-color-scheme:dark){:root{--bg:#070B14;--card:#111827;--ink:#E5E7EB;--mut:#9CA3AF;--line:#1F2937;--line2:#374151;--soft:#0F172A;--acc:#818CF8;--accL:#1E1B4B;
--canL:#062A1F;--sotL:#0B1D3F;--remL:#1E1338;--golL:#2A1C06;--posL:#052E16;--inp:#2A2410;--can:#34D399;--sot:#60A5FA;--rem:#A78BFA;--gol:#FBBF24;--pos:#4ADE80;--neg:#F87171;
--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:5;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 20px 18px;
 background:radial-gradient(120% 140% at 0% 0%,#3B3F9E 0%,#1B2A5C 45%,#0B1F3A 100%);border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(11,31,58,.18)}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
header h1.xl{font-size:29px;letter-spacing:-.7px;margin-top:2px}
header .lt{font-size:12px;font-weight:650;opacity:.75;text-transform:capitalize}
header .sub{font-size:12.5px;opacity:.75;margin-top:4px}
header button.back{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:13px;font-weight:650;padding:6px 12px;border-radius:999px;margin-bottom:8px;cursor:pointer}
main{padding:16px 16px calc(env(safe-area-inset-bottom) + 104px);max-width:760px;margin:0 auto}
/* navegação */
#bol{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:6;display:flex;justify-content:space-around;padding:6px 4px;border-radius:24px;
 background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 8px 30px rgba(16,24,40,.16);border:1px solid var(--line);max-width:740px;margin:0 auto}
#bol a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--mut);font-size:10.5px;font-weight:650;padding:5px 2px;border-radius:16px;position:relative}
#bol a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bol a.on{color:var(--acc);background:var(--accL)}
#bol a s{position:absolute;top:0;right:22%;text-decoration:none;background:var(--neg);color:#fff;border-radius:999px;font-size:10px;min-width:17px;padding:1px 4px;font-weight:800}
/* início */
.hero{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 4px;margin:-2px 0 14px}
.hero div{text-align:center;border-right:1px solid var(--line)}.hero div:last-child{border-right:0}
.hero b{display:block;font-size:22px;font-weight:850;letter-spacing:-.5px}.hero span{font-size:11px;color:var(--mut)}
.hero .up{color:var(--pos)}.hero .dn{color:var(--neg)}
.scg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc{background:var(--card);border-radius:18px;padding:12px 10px;text-decoration:none;color:var(--ink);box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;min-height:96px;transition:transform .08s}
.sc:active{transform:scale(.97)}
.sc .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:6px;color:#fff}
.sc b{font-size:14px;letter-spacing:-.2px}.sc small{font-size:11px;color:var(--mut)}
.hsc{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}.hsc::-webkit-scrollbar{display:none}
.mini-g{flex:none;width:200px;background:var(--card);border-radius:18px;padding:11px 12px;text-decoration:none;color:var(--ink);box-shadow:var(--sh);scroll-snap-align:start}
.mg-t{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:6px}.mg-r{display:flex;align-items:center;gap:7px;margin:3px 0;font-size:13.5px;white-space:nowrap;overflow:hidden}
.mg-r b{overflow:hidden;text-overflow:ellipsis}.mg-s{display:flex;gap:6px;margin-top:8px}.mg-s span{font-size:11.5px;font-weight:700;border-radius:8px;padding:3px 6px}
.c-can{background:var(--canL);color:var(--can)}.c-sot{background:var(--sotL);color:var(--sot)}.c-rem{background:var(--remL);color:var(--rem)}.c-gol{background:var(--golL);color:var(--gol)}
/* secções e listas */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px}
.sec h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.3px}.sec a{font-size:13px;color:var(--acc);text-decoration:none;font-weight:650}
.secs{font-size:12px;color:var(--mut);margin:-4px 2px 8px}
.day{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 6px}
.lgh{font-size:12.5px;font-weight:700;color:var(--ink);margin:10px 4px 6px;opacity:.85}
.info{font-size:12.5px;color:var(--mut);background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.info b{color:var(--ink)}
.note{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.45}
.warn{font-size:12px;line-height:1.45;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:8px 10px;margin:6px 0 8px}
.mn{font-size:11px;color:var(--mut);margin-top:2px}
.rs{display:inline-block;min-width:20px;padding:1px 5px;border-radius:6px;font-size:11px;font-weight:700;color:#fff}.rs-V{background:#16A34A}.rs-E{background:#94A3B8}.rs-D{background:#DC2626}
.empty{text-align:center;color:var(--mut);padding:44px 10px}
.box{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.box h3{margin:0 0 10px;font-size:15px;letter-spacing:-.2px}.box h3 small{font-weight:500;color:var(--mut)}
a.lk,a.box.lk{color:inherit;text-decoration:none;display:block}
.neg{color:var(--neg)}.pos{color:var(--pos)}
/* filtros */
.flt{margin-bottom:6px}
.seg2{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--sh)}
.seg2 button{flex:1;border:0;background:none;color:var(--mut);font-size:13px;font-weight:700;padding:9px 4px;border-radius:11px;cursor:pointer}
.seg2 button.on{background:var(--acc);color:#fff}
.bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:8px 0 4px;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.sm{padding:5px 10px;font-size:12px}
.chips2{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 10px;scrollbar-width:none}.chips2::-webkit-scrollbar{display:none}.chips2 span{flex:none;font-size:12px;color:var(--mut);align-self:center}
.row2{display:flex;gap:8px;margin:8px 0}
select,input[type=search]{flex:1;min-width:0;font-size:15px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--sh);-webkit-appearance:none}
/* cartão de jogo */
.gm{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;transition:transform .08s}.gm:active{transform:scale(.985)}
.gm-top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut)}
.gm-top .hr{font-weight:800;color:var(--ink);background:var(--soft);border-radius:8px;padding:2px 7px}.gm-top .lg{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tv{background:var(--posL);color:var(--pos);font-weight:800;border-radius:8px;padding:2px 7px;margin-left:4px}.ta{margin-left:4px}
.gm-tm{margin:10px 0}.gm-tm div{display:flex;align-items:center;gap:9px;margin:5px 0;font-size:15.5px}.gm-tm b{font-weight:700}
.ps{color:var(--mut);font-weight:600;font-size:11px}
.bd{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:800;flex:none;letter-spacing:-.3px}
.bd.sm{width:22px;height:22px;font-size:9px}
.gm-st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.gm-st div{border-radius:11px;padding:6px 8px;font-size:10.5px;font-weight:600}.gm-st b{display:block;font-size:17px;font-weight:850}
.p3{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:10px;gap:2px}.p3 i{display:block}
.p3l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:3px}
/* ligas */
.lgg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lgc{background:var(--card);border-radius:18px;padding:12px;text-decoration:none;color:var(--ink);box-shadow:var(--sh)}
.lgc .lf{font-size:26px}.lgc b{display:block;font-size:14px;margin-top:2px}.lgc small{color:var(--mut);font-size:11px}
.lgs{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--mut);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:700;color:var(--mut);text-align:center;padding:5px 2px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.3px}
td{text-align:center;padding:7px 2px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}
td.L{font-weight:800}
.cl td{padding:6px 2px}.cl .pos{font-weight:800;width:26px}.cl .pos.z1{color:var(--pos)}.cl .pos.z3{color:var(--neg)}
.tmn{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.fm{white-space:nowrap}.fm i{display:inline-block;width:15px;height:15px;border-radius:4px;font-style:normal;font-size:9px;font-weight:800;color:#fff;line-height:15px;margin:0 1px}
.fm .fV{background:#16A34A}.fm .fE{background:#94A3B8}.fm .fD{background:#DC2626}
.box.tb{padding:8px 10px}
.rk{display:inline-flex;width:20px;height:20px;border-radius:7px;background:var(--soft);color:var(--mut);font-size:11px;font-weight:800;align-items:center;justify-content:center;margin-right:7px;vertical-align:middle}
.rkr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.rkr:last-child{border-bottom:0}.rkr .nm{flex:1;font-weight:600;font-size:13.5px}
.ah{display:flex;justify-content:space-between;align-items:center}
/* seleções */
.op{background:var(--card);border-radius:18px;padding:11px 13px;margin-bottom:8px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh)}
.op .tx{flex:1;min-width:0}.op .tx div{font-size:11.5px;color:var(--mut)}.op .tx b{display:block;font-size:14px;color:var(--ink);margin:1px 0}
.op .pr{text-align:center;min-width:72px}.op .pr div{font-size:11px;color:var(--mut);margin-top:3px}
.pb,td .pb,.op .pb{display:inline-block;min-width:46px;border-radius:9px;padding:3px 5px;font-weight:800}
.pb.add{cursor:pointer;-webkit-user-select:none;user-select:none}.pb.sel{box-shadow:0 0 0 2px var(--ink) inset}.pb.sel::before{content:"✓ "}
.e{font-weight:800;font-size:12px}.e.pos{color:var(--pos);background:var(--posL);border-radius:7px;padding:1px 5px}.e.neg{color:var(--neg)}
input.odd{width:60px;font-size:15px;text-align:center;padding:6px 2px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
input.odd.api::placeholder{color:var(--sot);opacity:1;font-weight:700}
.cnt{font-size:11.5px;color:var(--mut);margin-top:6px}.cnt b{color:var(--ink)}
/* ficha do jogo */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{border-radius:18px;padding:12px 14px}
.kpi .t{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.kpi .v{font-size:31px;font-weight:850;line-height:1.1;margin:2px 0;letter-spacing:-.8px}
.kpi .s{font-size:12px;color:var(--mut)}
.c-can .t,.c-can .v{color:var(--can)}.c-sot .t,.c-sot .v{color:var(--sot)}.c-rem .t,.c-rem .v{color:var(--rem)}.c-gol .t,.c-gol .v{color:var(--gol)}
.kpi.c-can,.kpi.c-sot,.kpi.c-rem,.kpi.c-gol{color:inherit}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;font-weight:700;padding:9px 6px;border-radius:11px;cursor:pointer;white-space:nowrap}
.seg button.on{color:#fff}
.side{display:flex;gap:8px;margin-bottom:10px}
.side button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px;font-size:13px;font-weight:650;cursor:pointer;box-shadow:var(--sh)}
.side button.on{border-color:currentColor;font-weight:800}
.hist{display:flex;gap:3px;align-items:flex-end;height:48px;margin:6px 0 2px}.hist i{flex:1;border-radius:4px 4px 0 0;min-height:2px}.hist i.un{opacity:.32}
.histl{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.g3 div{background:var(--soft);border-radius:12px;padding:8px 4px;font-size:11px;color:var(--mut)}.g3 b{display:block;font-size:17px;color:var(--ink)}
.aus{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.tag{font-size:11.5px;background:#FEE2E2;color:#991B1B;border-radius:999px;padding:3px 10px;font-weight:600}.tag.dv{background:#FEF3C7;color:#92400E}
@media (prefers-color-scheme:dark){.tag{background:#3A1010;color:#FCA5A5}.tag.dv{background:#3A2A06;color:#FDE68A}}
.alert{background:#FEF3C7;color:#92400E;border-radius:14px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.alert{background:#3A2A06;color:#FDE68A}}
/* boletim, analista e outras */
.leg{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.leg:last-child{border-bottom:0}
.leg .tx{flex:1;min-width:0}.leg .tx div{font-size:11.5px;color:var(--mut)}.leg .tx b{font-size:14px}
.leg button{border:0;background:none;color:var(--neg);font-size:20px;cursor:pointer;padding:0 4px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
.big div{background:var(--card);border-radius:16px;padding:10px 4px;font-size:11px;color:var(--mut);box-shadow:var(--sh)}.big b{display:block;font-size:21px;color:var(--ink);font-weight:850}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:650;cursor:pointer;box-shadow:var(--sh)}
.btn.sm{font-size:12.5px;padding:7px 10px;margin-top:4px}
select.pl{width:100%;margin:4px 0}
.verd{border-radius:var(--r);padding:14px 16px;margin:10px 0;font-size:14px;line-height:1.45}
.verd.ok{background:var(--posL);color:var(--pos)}.verd.meh{background:#FEF3C7;color:#92400E}.verd.no{background:#FDE2E2;color:var(--neg)}
@media (prefers-color-scheme:dark){.verd.meh{background:#3A2A06;color:#FDE68A}.verd.no{background:#3A1010;color:#FCA5A5}}
.verd b{font-weight:850}.verd p{margin:6px 0 0;color:var(--ink);font-size:13px}
.anl p{margin:5px 0;font-size:13px;line-height:1.45}.anl p.mais{color:var(--pos)}.anl p.menos{color:#B45309}.anl p.dica{background:var(--inp);border-radius:11px;padding:8px 10px;color:var(--ink)}
@media (prefers-color-scheme:dark){.anl p.menos{color:#FBBF24}}
.trc{border-top:1px dashed var(--line);margin-top:8px;padding-top:4px}.tr1{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:5px 0;font-size:13px}.tr1 .btn{margin:0;white-space:nowrap}
.rw2{display:flex;gap:6px;margin:6px 0}.rw2 input,.rw2 select{flex:1;min-width:0;font-size:16px;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label.lb{flex:1;min-width:0;font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
label.lb input{width:100%;box-sizing:border-box;min-width:0;font-size:16px;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
.ia details{margin:4px 0 8px}.ia summary{font-size:13px;color:var(--mut);cursor:pointer}
.mdd{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:2px solid var(--gol);box-shadow:var(--sh)}
.mdd .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.mdd .hd b{color:var(--gol);font-size:15px}.mdd .hd span{font-size:11px;color:var(--mut)}
.mdd .sl{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.mdd .sl:last-of-type{border-bottom:0}.mdd .sl div{font-size:11px;color:var(--mut)}.mdd .sl b{font-weight:650}
.mdd .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.mdd button{border:0;background:var(--gol);color:#fff;border-radius:11px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
.cmp{background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.cmp .hd{font-size:12px;font-weight:800;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between}
.cmp .rw{display:flex;gap:6px;margin-bottom:6px}.cmp select,.cmp input{font-size:15px;padding:8px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0;box-shadow:none}
.cmp select{flex:1}.cmp input.ln{width:72px}.cmp input.od{width:80px;background:var(--inp)}
.cmp .res{font-size:12.5px;color:var(--mut);margin-top:2px}.cmp .res b{color:var(--ink)}
.list{background:var(--card);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--sh)}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}.lrow:last-child{border-bottom:0}
.chev{color:var(--mut);font-size:20px}
details.bl{border-bottom:1px solid var(--line)}details.bl:last-child{border-bottom:0}
details.bl summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 2px;cursor:pointer}details.bl summary::-webkit-details-marker{display:none}

function famDe(sp,x){if(!sp)return null;
 if(sp.L!=null){const o=sp.ov?'o':'u';if(['can','sot','rem'].includes(sp.s))return sp.s+sp.q+o;if(sp.s==='gol')return 'gol'+sp.q+o;if(sp.s==='g1'||sp.s==='g2')return sp.s+'t'+o}
 const t=(x&&x.t)||sp.lab||'';if(/^Ambas marcam/.test(t))return 'btts'+(/Sim/.test(t)?'s':'n');if(/^Golos nas duas partes/.test(t))return 'golduas'+(/Sim/.test(t)?'s':'n');return null}
const nivelDe=k=>['can','sot','rem','gol'].includes(k.slice(0,3))||['g1','g2'].includes(k.slice(0,2))?k.slice(0,3):'out';
function apInfo(k){const AP=D.ap||{},lv=k?[k,nivelDe(k),'*']:['*'];let r=0.9,nr=0,cal=0,hist=null,fonte='';
 for(const l of lv){const a=AP[l];if(a&&a[0]>=3&&a[1]){nr=a[0];r=(a[0]*a[1]+6*0.9)/(a[0]+6);fonte=l;break}}
 for(const l of lv){const a=AP[l];if(a&&a[2]>=5){const n=a[2];cal=Math.max(-0.06,Math.min(0.06,(a[3]-a[4])/n*n/(n+40)));hist={n,w:a[3],e:a[4],l};break}}
 return {r,nr,cal,hist,fonte}}

function candidatos(dia,pmin,excl,omin,emin){const out=[];omin=omin||1.35;emin=emin??-1;D.jogos.forEach(j=>{if(j.d!==dia||excl.has(j.c+' vs '+j.f))return;let best=null;
  selecoes(j).forEach(x=>{if(x.p<pmin||x.p>0.82||!equilibrada(x)||(x.c!=null&&x.c<0.5))return;const sp=x.L!=null?{s:x.s,q:x.q,L:x.L,ov:x.ov}:null;
   const k=famDe(sp,x),ai=apInfo(k),pc_=Math.max(0.01,Math.min(0.99,x.p+ai.cal)),oe=ai.r/x.p;if(oe<omin||pc_*oe-1<=emin)return;
   let ctx=0;if(sp&&(sp.q==='c'||sp.q==='f')&&j.p[0]!=null){const pe=sp.q==='c'?j.p[0]:j.p[2];if(sp.ov&&pe<0.25)ctx-=0.05;if(sp.ov&&pe>0.55)ctx+=0.02;if(!sp.ov&&pe>0.55)ctx-=0.05}
   if((j.eu||[]).some(Boolean)&&sp&&sp.ov)ctx-=0.02;
   const sc=(pc_*oe-1)+0.5*(x.p-0.6)+0.15*((x.c??0.55)-0.5)+ctx;if(!best||sc>best.sc)best=Object.assign({sc,oe,pcal:pc_},x)});
  if(best)out.push(best)});return out.sort((a,b)=>b.sc-a.sc)}

function jogoDe(x){return D.jogos.find(j=>j.d===x.d&&(j.c+' vs '+j.f)===x.g)}
function specDe(x){if(x.sp)return x.sp;const id=x.id||'';
 if(id.startsWith('odd|')){const a=id.split('|');if(a.length>=8&&(a[7]==='over'||a[7]==='under'))return {s:a[4],q:a[5],L:parseFloat(a[6]),ov:a[7]==='over'};return {s:a[4],q:a[5],lab:a[6]}}
 if(x.m){const m=x.m,sel=String(x.s||''),mm=sel.match(/(over|under|mais|menos)\s*(?:de\s*)?([\d.,]+)/i);
  const st=/^Cantos/.test(m)?'can':/^Remates à baliza/.test(m)?'sot':/^Remates/.test(m)?'rem':/^Golos — 1/.test(m)?'g1':/^Golos — 2/.test(m)?'g2':/^Golos/.test(m)?'gol':null;
  const q=/total|parte/.test(m)?'t':/casa/.test(m)?'c':/visitante/.test(m)?'f':null;
  if(st&&q&&mm)return {s:st,q,L:parseFloat(mm[2].replace(',','.')),ov:/over|mais/i.test(mm[1])}}
 return null}
function poisPm(l){const pm=[];let p=Math.exp(-l);for(let k=0;k<30;k++){pm.push(p);p*=l/(k+1)}return pm}
function distQ(j,s,q){if(s==='g1'||s==='g2'){const T=j.g[0]+j.g[1],s1=j.s1??0.445;if(!(T>0))return null;const l=s==='g1'?T*s1:T*(1-s1);return {mu:l,pm:poisPm(l)}}return distrib(j,s,q)}

function analisaPerna(x){
 const j=jogoDe(x),sp=specDe(x),v=lerOdd(x.id),o=parseFloat((v||'').replace(',','.')),odd=o>1?o:null;

 if(j&&sp&&sp.L!=null){d=distQ(j,sp.s,sp.q);if(d){const pa=pAcima(d.pm,sp.L);A.p=sp.ov?pa:1-pa}}
 else if(j&&sp&&sp.lab!=null){const y=selecoes(j).find(z=>z.id===x.id);if(y)A.p=y.p}

 if(st==='can')A.lim=0.08;

 // 1) número principal
 if(d){const sd=Math.sqrt(d.pm.reduce((a,v,k)=>a+v*(k-d.mu)**2,0)),alvo=sp.q==='t'?'no jogo':(sp.q==='c'?j.c:j.f),dist=sp.L-d.mu;

  A.txt.push(`O modelo espera <b>${f1(d.mu)} ${NMQ[st]}</b> ${esc(alvo)} (intervalo provável ${Math.max(0,Math.round(d.mu-sd))}–${Math.round(d.mu+sd)}). A linha ${sp.L} está ${pos}: modelo <b>${pc(p)}</b> (odd justa ${od(p)}).`);
  const borda=sp.ov?(d.pm[Math.floor(sp.L)]||0):(d.pm[Math.floor(sp.L)+1]||0);A.borda=borda;
  if(borda>=0.13){A.menos.push(`Linha apertada: em ${pc(borda)} dos casos fica a 1 ${un} de ganhar.`);A.sc-=0.5}
  // forma recente vs modelo
  const Fc=D.forma[j.c],Ff=D.forma[j.f],kA=isGol?'golA':st+'A';
  if(st!=='g1'&&st!=='g2'&&Fc&&Ff&&Fc[kA]&&Ff[kA]){const a=Fc[kA],b=Ff[kA];let fm=null,expl='';
   if(sp.q==='c'&&a[0]!=null&&b[1]!=null){fm=(a[0]+b[1])/2;expl=`${esc(j.c)} faz ${f1(a[0])} por jogo, ${esc(j.f)} concede ${f1(b[1])}`}
   else if(sp.q==='f'&&b[0]!=null&&a[1]!=null){fm=(b[0]+a[1])/2;expl=`${esc(j.f)} faz ${f1(b[0])} por jogo, ${esc(j.c)} concede ${f1(a[1])}`}
   else if(sp.q==='t'&&a[0]!=null&&a[1]!=null&&b[0]!=null&&b[1]!=null){fm=(a[0]+b[1])/2+(b[0]+a[1])/2;expl=`${esc(j.c)} ${f1(a[0])} feitos/${f1(a[1])} sofridos, ${esc(j.f)} ${f1(b[0])}/${f1(b[1])}`}
   if(fm!=null){const rel=(fm-d.mu)/Math.max(d.mu,0.5),fav=(sp.ov?fm>sp.L:fm<sp.L);
    const t=`Forma recente (${expl}) aponta para ~${f1(fm)}`;
    if(Math.abs(rel)<0.1)A.txt.push(t+': confirma o modelo.');

    else{A.menos.push(t+(rel>0?', acima do modelo':', abaixo do modelo')+': contra a tua aposta.');A.sc-=1}}}
  // últimos 10 jogos
  const H=st==='g1'?[[j.c,Fc&&Fc.h1],[j.f,Ff&&Ff.h1]]:st==='g2'?[]:histMK(j,st,sp.q);
  const hs=H.map(([eq,arr])=>{const vv=(arr||[]).filter(z=>z!=null);if(!vv.length)return null;return {eq,k:vv.filter(z=>sp.ov?z>sp.L:z<sp.L).length,n:vv.length}}).filter(Boolean);
  if(hs.length){const hp=hs.reduce((a,z)=>a+z.k/z.n,0)/hs.length;A.hp=hp;const t='Últimos jogos: '+hs.map(z=>`${esc(z.eq)} ${z.k}/${z.n}`).join(', ')+` teriam ganho esta aposta.`;
   if(hp>=0.6){A.mais.push(t);A.sc+=1}else if(hp<0.4){A.menos.push(t);A.sc-=1}else A.txt.push(t)}}

function nbPmf(m,disp,n){const out=[];if(m==null||!(m>0))return out;
 if(disp<=1.02){let p=Math.exp(-m);for(let i=0;i<=n;i++){out.push(p);p*=m/(i+1)}}
 else{const r=m/(disp-1),q=1/disp;let p=Math.exp(r*Math.log(q));for(let i=0;i<=n;i++){out.push(p);p*=(i+r)/(i+1)*(1-q)}}return out}
function maisQue(mc,mf,disp){const n=Math.ceil(Math.max(mc,mf)*4+15),a=nbPmf(mc,disp,n),b=nbPmf(mf,disp,n);let c=0,e=0,f=0;
 for(let x=0;x<=n;x++)for(let y=0;y<=n;y++){const v=a[x]*b[y];if(x>y)c+=v;else if(x===y)e+=v;else f+=v}const t=c+e+f;return [c/t,e/t,f/t]}
// ---------- golos: Dixon-Coles (igual ao Excel/Python) e Poisson por partes
function pois(l,k){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p}
function poisOver(l,L){if(l==null||!(l>0))return null;let c=0;for(let i=0;i<=Math.floor(L);i++)c+=pois(l,i);return Math.max(0,Math.min(1,1-c))}
function grelha(lh,la,rho){const n=10,g=[];let s=0;for(let i=0;i<=n;i++){g.push([]);for(let k=0;k<=n;k++){let v=pois(lh,i)*pois(la,k);
 if(i===0&&k===0)v*=Math.max(1-lh*la*rho,1e-6);else if(i===0&&k===1)v*=Math.max(1+lh*rho,1e-6);else if(i===1&&k===0)v*=Math.max(1+la*rho,1e-6);
 else if(i===1&&k===1)v*=Math.max(1-rho,1e-6);g[i].push(v);s+=v}}return g.map(r=>r.map(v=>v/s))}
function pG(g,f){let p=0;g.forEach((r,i)=>r.forEach((v,k)=>{if(f(i,k))p+=v}));return p}
function partes(l1,l2){let a=0,b=0;for(let x=0;x<=10;x++)for(let y=0;y<=10;y++){const v=pois(l1,x)*pois(l2,y);if(x>y)a+=v;else if(y>x)b+=v}return [a,1-a-b,b]}
const corPb=(p,cor)=>{const a=p==null?0:Math.min(1,Math.max(0,p));return `background:color-mix(in srgb,${cor} ${Math.round(a*70)}%,transparent);color:${a>0.75?'#fff':'inherit'}`};
const celOdd=(k,p)=>{const own=lerOddMeu(k),api=oddApi(k),v=own||api;const e=v&&p!=null?p*parseFloat(v.replace(',','.'))-1:null;

let CMP={i:null,s:'rem',q:'t',lado:'o',rows:[{},{},{}]};
const NMS={can:'cantos',sot:'remates à baliza',rem:'remates',gol:'golos'};
function distrib(j,s,q){ // distribuição do modelo (probabilidade de cada número) + média
 if(s==='gol'){const lh=j.g[0],la=j.g[1];if(!(lh>0&&la>0))return null;const G=grelha(lh,la,j.rho??-0.05),n=G.length;const pm=new Array(2*n).fill(0);
  G.forEach((r,a)=>r.forEach((v,b)=>{const k=q==='t'?a+b:q==='c'?a:b;pm[k]+=v}));return {mu:q==='t'?lh+la:q==='c'?lh:la,pm}}
 const m=j[s];if(!m||m[0]==null||m[1]==null)return null;const mu=q==='t'?m[0]+m[1]:q==='c'?m[0]:m[1];
 const pm=nbPmf(mu,q==='t'?D.disp[s][1]:D.disp[s][0],Math.ceil(mu*3+20));return {mu,pm}}
const pAcima=(pm,L)=>pm.reduce((a,v,k)=>a+(k>L?v:0),0);
function histMK(j,s,q){const Fc=D.forma[j.c],Ff=D.forma[j.f],key=s==='gol'?'gol':s;
 if(q==='t')return [[j.c,Fc&&Fc[key]],[j.f,Ff&&Ff[key]]];return [[q==='c'?j.c:j.f,(q==='c'?Fc:Ff)&&(q==='c'?Fc:Ff)[key+'F']]]}
function comparar(i){
 if(i!=null&&i!==CMP.i){CMP.i=i;CMP.rows=[{},{},{}]}
 const j=CMP.i!=null?D.jogos[CMP.i]:null;
 $('#hd').innerHTML=`<button class="back" onclick="location.hash=''">‹ Início</button><h1 class="xl">Comparar linhas</h1><div class="sub">Escreve as linhas e odds que a casa oferece: o modelo diz qual (se alguma) vale a pena</div>`;
 let h=`<div class="cmp"><div class="hd">Jogo</div><div class="rw"><select id="cj"><option value="">Escolhe o jogo…</option>${D.jogos.map((x,k)=>`<option value="${k}" ${k===CMP.i?'selected':''}>${esc(fmtDia(x.d).split(' · ').pop())} · ${esc(x.c)} vs ${esc(x.f)}</option>`).join('')}</select></div></div>`;
 if(j){const d=distrib(j,CMP.s,CMP.q);
  const seg=(f,ops)=>`<div class="seg" style="margin-bottom:6px">${ops.map(([k,t])=>`<button data-cf="${f}" data-v="${k}" class="${CMP[f]===k?'on':''}" style="${CMP[f]===k?'background:var(--navy)':''}">${esc(t)}</button>`).join('')}</div>`;
  h+=seg('s',[['can','Cantos'],['sot','Rem. baliza'],['rem','Remates'],['gol','Golos']])+seg('q',[['t','Total do jogo'],['c',j.c],['f',j.f]])+seg('lado',[['o','Over (mais de)'],['u','Under (menos de)']]);
  if(d){const sd=Math.sqrt(d.pm.reduce((a,v,k)=>a+v*(k-d.mu)**2,0));
   h+=`<div class="info"><b>Esperado ${f1(d.mu)} ${NMS[CMP.s]}</b> · provável ${Math.max(0,Math.round(d.mu-sd))}–${Math.round(d.mu+sd)}</div>`;
   h+=`<div class="cmp"><div class="hd"><span>Linhas da casa</span><span>linha · odd</span></div>`;
   CMP.rows.forEach((r,n)=>{h+=`<div class="rw"><span style="align-self:center;font-weight:700;width:52px;color:var(--mut)">${CMP.lado==='o'?'Over':'Under'}</span>
    <input class="ln" style="flex:1" data-r="${n}" data-f="L" inputmode="decimal" placeholder="ex. ${(Math.round(d.mu)-0.5+n-1).toFixed(1)}" value="${r.L??''}">
    <input class="od" style="flex:1" data-r="${n}" data-f="odd" inputmode="decimal" placeholder="odd" value="${r.odd??''}"></div>`});
   h+='</div><div id="verd"></div><div id="escada"></div>'}
  else h+='<div class="empty">Sem dados do modelo para esta estatística neste jogo.</div>'}
 else h+='<div class="note">Também podes abrir um jogo e tocar em "Comparar".</div>';
 $('#mn').innerHTML=h;
 $('#cj').onchange=e=>{const v=e.target.value;location.hash=v===''?'c':'c'+v};
 document.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{CMP[b.dataset.cf]=b.dataset.v;comparar(CMP.i)});
 document.querySelectorAll('[data-r]').forEach(el=>el.oninput=()=>{const v=parseFloat(el.value.replace(',','.'));CMP.rows[+el.dataset.r][el.dataset.f]=isNaN(v)?null:v;calcCmp()});
 if(j)calcCmp()}
function calcCmp(){const j=D.jogos[CMP.i],d=distrib(j,CMP.s,CMP.q);if(!d)return;const ov=CMP.lado==='o',nm=NMS[CMP.s];
 const lim=CMP.s==='can'?0.08:0.05,H=histMK(j,CMP.s,CMP.q),un=CMP.s==='gol'?'golo':(CMP.s==='can'?'canto':'remate');
 const alvo=CMP.q==='t'?'no jogo':(CMP.q==='c'?j.c:j.f);
 const R=CMP.rows.map((r,n)=>Object.assign({n},r)).filter(r=>r.L!=null).map(r=>{const L=r.L,pa=pAcima(d.pm,L),p=ov?pa:1-pa;
  const borda=ov?(d.pm[Math.floor(L)]||0):(d.pm[Math.floor(L)+1]||0); // fica a 1 de ganhar
  const hs=H.map(([eq,a])=>{const v=(a||[]).filter(x=>x!=null);if(!v.length)return null;const k=v.filter(x=>ov?x>L:x<L).length;return {eq,k,n:v.length}}).filter(x=>x);
  const hp=hs.length?hs.reduce((a,x)=>a+x.k/x.n,0)/hs.length:null;const e=r.odd>1?p*r.odd-1:null;return Object.assign(r,{p,borda,hs,hp,e})});
 // conselho por linha
 const frase=r=>{const dist=r.L-d.mu,pos=Math.abs(dist)<0.6?'praticamente na média esperada':(dist>0?`${f1(dist)} acima do esperado (${f1(d.mu)})`:`${f1(-dist)} abaixo do esperado (${f1(d.mu)})`);
  let t=`<b>${ov?'Over':'Under'} ${r.L}${r.odd>1?' a '+r.odd.toFixed(2):''}</b> — linha ${pos}. Modelo ${pc(r.p)} (odd justa ${od(r.p)})`;
  if(r.e!=null)t+=`, Betclic acha ${pc(1/r.odd)} → Edge <b>${(r.e>0?'+':'')+Math.round(r.e*100)}%</b>`;t+='. ';
  if(r.hs.length)t+='Últimos jogos: '+r.hs.map(x=>`${esc(x.eq)} ${x.k}/${x.n}`).join(', ')+` passaram${ov?'':' abaixo de'} ${r.L}. `;
  t+=`Em ${pc(r.borda)} dos casos fica a 1 ${un} de ganhar.`;
  let v;if(r.e==null)v='';else if(r.e>=lim&&(r.hp==null||r.hp>=0.5))v=' ✓ <b>Vale a pena.</b>';
  else if(r.e>=lim)v=' ≈ O modelo vê valor mas a forma recente não confirma: só valor pequeno.';
  else if(r.e>=0)v=` ≈ Margem curta (abaixo de +${Math.round(lim*100)}%).`;else v=` ✗ Não compensa: precisava de odd ≥ ${((1+lim)/r.p).toFixed(2)}.`;
  return t+v};
 const comOdd=R.filter(r=>r.e!=null);let html='';
 if(comOdd.length){const sc=r=>r.e-lim+(r.hp==null?0:(r.hp-0.5)*0.1);const best=comOdd.slice().sort((a,b)=>sc(b)-sc(a))[0];
  const ok=best.e>=lim&&(best.hp==null||best.hp>=0.5),meh=!ok&&best.e>=0;
  let topo=ok?`✓ A melhor é <b>${ov?'Over':'Under'} ${best.L} a ${best.odd.toFixed(2)}</b> (Edge ${(best.e>0?'+':'')+Math.round(best.e*100)}%).`
   :meh?`≈ Nenhuma tem margem segura. A menos má é <b>${ov?'Over':'Under'} ${best.L}</b> (Edge ${(best.e>0?'+':'')+Math.round(best.e*100)}%).`
   :`✗ Nenhuma das linhas vale a pena com estas odds.`;
  // linhas que a Betclic salta
  const Ls=comOdd.map(r=>r.L).sort((a,b)=>a-b),salt=[];for(let k=0;k<Ls.length-1;k++)for(let L=Ls[k]+1;L<Ls[k+1];L++)salt.push(L);
  const notaS=salt.length?`<p>A Betclic não oferece ${salt.map(L=>(ov?'Over ':'Under ')+L.toFixed(1)).join(', ')}: o modelo dava-lhe${salt.length>1?'s':''} ${salt.map(L=>{const pa=pAcima(d.pm,L);return pc(ov?pa:1-pa)}).join(', ')}.</p>`:'';
  html=`<div class="verd ${ok?'ok':meh?'meh':'no'}">${topo}${notaS}<p>${R.map(frase).join('</p><p>')}</p>${CMP.s==='can'?'<p>Nos cantos o modelo é menos preciso: pede Edge ≥ +8%.</p>':''}</div>`;
  if(ok||meh)html+=`<button class="btn" id="cmpadd">Juntar ${ov?'Over':'Under'} ${best.L} ao boletim</button>`;
  $('#verd').innerHTML=html;
  if($('#cmpadd'))$('#cmpadd').onclick=()=>{const t=`${nm[0].toUpperCase()+nm.slice(1)} ${alvo}: ${ov?'mais':'menos'} de ${best.L}`,id='cmp|'+j.d+'|'+j.c+'|'+j.f+'|'+t;
   gravaOdd(id,String(best.odd));if(!noB(id)){B.push({id,g:j.c+' vs '+j.f,d:j.d,t,p:Math.round(best.p*10000)/10000,sp:{s:CMP.s,q:CMP.q,L:best.L,ov}});gravaB()}barraB();$('#cmpadd').textContent='✓ No boletim'}}
 else $('#verd').innerHTML=R.length?`<div class="note">Escreve as odds da casa para ver o Edge.</div><div class="verd meh"><p>${R.map(frase).join('</p><p>')}</p></div>`:'';
 // escada do modelo à volta da média
 const b0=Math.max(0.5,Math.round(d.mu)-3.5);let es='<table><tr><th>Linha</th><th>Over</th><th>Odd justa</th><th>Under</th><th>Odd justa</th></tr>';
 for(let L=b0;L<=Math.round(d.mu)+3.5;L++){const pa=pAcima(d.pm,L),mark=R.some(r=>r.L===L);es+=`<tr style="${mark?'font-weight:800':''}"><td class="L">${L.toFixed(1)}${mark?' ◂':''}</td><td>${pc(pa)}</td><td>${od(pa)}</td><td>${pc(1-pa)}</td><td>${od(1-pa)}</td></tr>`}
 $('#escada').innerHTML=`<div class="box"><h3>Escada do modelo <small>· ${nm} ${esc(alvo)}</small></h3>${es}</table><div class="note">◂ = linhas que escreveste. Serve para ver as linhas que a Betclic salta.</div></div>`}
function rota(){const m=location.hash.match(/^#j(\d+)$/),hs=location.hash,mc=hs.match(/^#c(\d*)$/),ml=hs.match(/^#liga(\d+)$/);
 if(m)detalhe(+m[1]);else if(mc)comparar(mc[1]===''?null:+mc[1]);else if(ml)ligaV(+ml[1]);else if(hs==='#b')boletim();else if(hs==='#m')multiplas();else if(hs==='#o')melhores();
 else if(hs==='#jogos'||hs==='#l')jogosV();else if(hs==='#valor')valorV();else if(hs==='#ligas')ligasV();else if(hs==='#marc')marcV();else if(hs==='#aus')ausV();
 else if(hs==='#mais')maisV();else if(hs==='#hist')histV();else if(hs==='#def')defV();else if(hs==='#ajuda')ajudaV();else if(hs==='#sel')selV();else inicioV();
 window.scrollTo(0,0);barraB()}
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
window.addEventListener('hashchange',rota);
if(!D||!D.jogos){document.body.innerHTML='<div class="empty">Sem dados. Corre o ATUALIZAR no PC.</div>'}else rota();
</script>
